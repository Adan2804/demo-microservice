# ============================================
# VARIABLES PARA KEDA - AMBIENTE QA
# ============================================

# --- Información del Servicio ---
service=demo-microservice
namespace=qa-namespace
env=qa

# --- Labels Estándar del Banco ---
cost-center=12345
application-code=APP001
project-name=proyecto-demo
pmo=PMO-001
work-team=equipo-desarrollo

# --- Versiones (Dynatrace) ---
dt-release-version=1.0.0
dt-build-version=1.0.0-SNAPSHOT
dt-release-product=producto-demo
dt-release-stage=qa

# --- Configuración de Réplicas ---
replicas=3
replicas-max=10
replicas-downscale=0
replicas-upscale=1

# --- Configuración de KEDA ---
polling-interval=10
cooldown-period=30

# --- Configuración de Timezone ---
timezone=America/Bogota

# --- Configuración de Cron (Horarios de Escalado) ---
# Formato: "minuto hora día mes día-semana"
# Ejemplo actual: Downscale de 10:14 AM a 10:14 AM (ajustar según necesidad)
cron-downscale-start=0 14 * * *
cron-downscale-end=10 14 * * *
cron-upscale-start=0 14 * * *
cron-upscale-end=10 14 * * *

# --- Configuración de HPA Behavior ---
hpa-period-downscaling-seconds=30
hpa-stabilization-downscaling-value=1
hpa-stabilization-window-seconds=30
hpa-period-upscaling-seconds=30
hpa-stabilization-upscaling-value=2
