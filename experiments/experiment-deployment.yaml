apiVersion: argoproj.io/v1alpha1
kind: Experiment
metadata:
  name: demo-microservice-experiment
  namespace: default
  labels:
    app: demo-microservice-istio
    experiment-type: ab-testing
  annotations:
    # Evitar que ArgoCD intente gestionar este recurso
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
spec:
  duration: 24h
  progressDeadlineSeconds: 86400  # 24 horas en segundos
  scaleDownDelaySeconds: 30
  
  templates:
  # Template para versión experimental
  # Los pods tendrán los labels necesarios para:
  # 1. Ser seleccionados por el service demo-microservice-istio (label: app=demo-microservice-istio)
  # 2. Ser identificados por el DestinationRule subset "experiment" (labels: tier=experiment, version=experimental)
  - name: experiment
    replicas: 1
    selector:
      matchLabels:
        app: demo-microservice-istio
        tier: experiment
        version: experimental
    template:
      metadata:
        labels:
          app: demo-microservice-istio  # IMPORTANTE: Para que el service lo seleccione
          tier: experiment               # IMPORTANTE: Para el DestinationRule subset
          version: experimental          # IMPORTANTE: Para el DestinationRule subset
        annotations:
          sidecar.istio.io/inject: "true"  # Inyectar Istio sidecar
      spec:
        containers:
        - name: demo-microservice
          image: zadan04/demo-microservice:experiment
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8080
            name: http
          env:
          - name: SERVER_PORT
            value: "8080"
          - name: APP_VERSION
            value: "experiment-v2.0.0"
          - name: EXPERIMENT_ENABLED
            value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
