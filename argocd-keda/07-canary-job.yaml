# Job DESHABILITADO - Usar VirtualService manual en su lugar
# 
# El Job tiene problemas de conectividad con la API de Kubernetes en Minikube
# 
# ALTERNATIVA SIMPLE:
# 1. Aplicar manualmente: kubectl apply -f 06-virtualservice-canary.yaml
# 2. Hacer el cambio de imagen en el deployment
# 3. Probar con header: curl -H "x-canary-test: true" http://...
# 4. Después de 10 min, eliminar: kubectl delete -f 06-virtualservice-canary.yaml
#
# Este archivo está deshabilitado cambiando el kind a Job-DISABLED
apiVersion: batch/v1
kind: Job-DISABLED
metadata:
  name: canary-manager
  namespace: default
  labels:
    app: demo-microservice-keda
    component: canary-manager
    managed-by: argocd-keda
spec:
  ttlSecondsAfterFinished: 3600  # Limpia el Job después de 1 hora
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: canary-manager
    spec:
      serviceAccountName: canary-manager-sa
      restartPolicy: Never
      # Necesario para acceder a la API de Kubernetes
      automountServiceAccountToken: true
      containers:
      - name: canary-controller
        image: bitnami/kubectl:1.32
        command:
          - /bin/bash
          - -c
          - |
            set -e
            
            echo "🚀 Canary Manager iniciado"
            echo "Esperando primer pod nuevo READY..."
            
            # Función para contar pods READY
            count_ready_pods() {
              kubectl get pods -n default \
                -l app=demo-microservice-keda \
                --field-selector=status.phase=Running \
                -o json | jq '[.items[] | select(.status.conditions[] | select(.type=="Ready" and .status=="True"))] | length'
            }
            
            # Función para obtener ReplicaSets
            get_replicasets() {
              kubectl get rs -n default \
                -l app=demo-microservice-keda \
                --sort-by=.metadata.creationTimestamp \
                -o json
            }
            
            INITIAL_PODS=$(count_ready_pods)
            echo "Pods READY iniciales: $INITIAL_PODS"
            
            # Esperar hasta detectar un pod adicional (3 old + 1 new = 4)
            TIMEOUT=600  # 10 minutos timeout
            ELAPSED=0
            
            while [ $ELAPSED -lt $TIMEOUT ]; do
              CURRENT_PODS=$(count_ready_pods)
              
              if [ $CURRENT_PODS -gt $INITIAL_PODS ]; then
                echo "✅ Detectado pod nuevo READY! ($CURRENT_PODS pods activos)"
                break
              fi
              
              echo "Esperando... ($ELAPSED/$TIMEOUT segundos) - Pods: $CURRENT_PODS"
              sleep 10
              ELAPSED=$((ELAPSED + 10))
            done
            
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "❌ Timeout esperando pod nuevo"
              exit 1
            fi
            
            # Obtener hash del ReplicaSet nuevo (el más reciente)
            echo "Identificando ReplicaSets..."
            RS_DATA=$(get_replicasets)
            
            NEW_RS_HASH=$(echo "$RS_DATA" | jq -r '.items[-1].metadata.labels["pod-template-hash"]')
            OLD_RS_HASH=$(echo "$RS_DATA" | jq -r '.items[-2].metadata.labels["pod-template-hash"]')
            
            echo "ReplicaSet OLD hash: $OLD_RS_HASH"
            echo "ReplicaSet NEW hash: $NEW_RS_HASH"
            
            # Aplicar DestinationRule con los hashes correctos
            echo "🔧 Aplicando DestinationRule..."
            cat <<EOF | kubectl apply -f -
            apiVersion: networking.istio.io/v1beta1
            kind: DestinationRule
            metadata:
              name: demo-microservice-keda-dr
              namespace: default
            spec:
              host: demo-microservice-keda.default.svc.cluster.local
              subsets:
                - name: old-version
                  labels:
                    app: demo-microservice-keda
                    pod-template-hash: "$OLD_RS_HASH"
                - name: new-version
                  labels:
                    app: demo-microservice-keda
                    pod-template-hash: "$NEW_RS_HASH"
            EOF
            
            # Aplicar VirtualService
            echo "🔒 Aplicando VirtualService temporal..."
            kubectl apply -f /manifests/06-virtualservice-canary.yaml
            
            echo "✅ VirtualService activo - Periodo de prueba iniciado"
            echo ""
            echo "📋 INSTRUCCIONES DE PRUEBA:"
            echo "  Tráfico normal:  curl http://demo-microservice-keda:8080/actuator/health"
            echo "  Tráfico canary:  curl -H 'x-canary-test: true' http://demo-microservice-keda:8080/actuator/health"
            echo ""
            echo "⏱️  Esperando 10 minutos antes de continuar rolling update..."
            
            # Esperar 10 minutos (periodo de prueba)
            sleep 600
            
            # Eliminar VirtualService para permitir rolling update normal
            echo "🚀 Periodo de prueba completado"
            echo "Eliminando VirtualService temporal..."
            kubectl delete virtualservice demo-microservice-keda-canary -n default --ignore-not-found=true
            
            echo "✅ VirtualService eliminado - Rolling update puede continuar"
            echo "🎉 Canary Manager completado exitosamente"
        volumeMounts:
          - name: manifests
            mountPath: /manifests
            readOnly: true
      volumes:
        - name: manifests
          configMap:
            name: canary-manifests
