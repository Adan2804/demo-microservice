# RBAC para el Job de Canary Manager
# Permisos necesarios para gestionar VirtualService y DestinationRule
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canary-manager-sa
  namespace: default
  labels:
    app: demo-microservice-keda
    component: canary-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canary-manager-role
  namespace: default
spec:
  rules:
    # Permisos para leer pods y replicasets
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]
    
    - apiGroups: ["apps"]
      resources: ["replicasets"]
      verbs: ["get", "list", "watch"]
    
    # Permisos para gestionar Istio resources
    - apiGroups: ["networking.istio.io"]
      resources: ["virtualservices", "destinationrules"]
      verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canary-manager-binding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canary-manager-role
subjects:
  - kind: ServiceAccount
    name: canary-manager-sa
    namespace: default
