# ConfigMap con el manifest del VirtualService
# Usado por el Job para aplicar el VirtualService temporal
apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-manifests
  namespace: default
  labels:
    app: demo-microservice-keda
    component: canary-manager
data:
  06-virtualservice-canary.yaml: |
    apiVersion: networking.istio.io/v1beta1
    kind: VirtualService
    metadata:
      name: demo-microservice-keda-canary
      namespace: default
      labels:
        app: demo-microservice-keda
        managed-by: canary-job
        temporary: "true"
    spec:
      hosts:
        - demo-microservice-keda.default.svc.cluster.local
        - demo-microservice-keda
      
      http:
        - match:
            - headers:
                x-canary-test:
                  exact: "true"
          route:
            - destination:
                host: demo-microservice-keda.default.svc.cluster.local
                subset: new-version
              weight: 100
          timeout: 30s
        
        - route:
            - destination:
                host: demo-microservice-keda.default.svc.cluster.local
                subset: old-version
              weight: 100
          timeout: 30s
