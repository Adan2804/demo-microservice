# Deployment CANARY separado
# Se despliega junto al stable para pruebas graduales
# Usa label version: canary para diferenciarse

apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-microservice-keda-canary
  namespace: default
  labels:
    app: demo-microservice-keda
    version: canary
    managed-by: argocd-keda
    deployment-type: canary
spec:
  replicas: 1  # Solo 1 pod canary inicialmente
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: demo-microservice-keda
      version: canary
  template:
    metadata:
      labels:
        app: demo-microservice-keda
        version: canary
        sidecar.istio.io/inject: "true"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: demo-microservice
        image: zadan04/demo-microservice:experiment  # Versión canary
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: APP_VERSION
          value: "canary-experiment"
        - name: ENVIRONMENT
          value: "canary-test"
        - name: EXPERIMENT_ENABLED
          value: "true"
        - name: ISTIO_ENABLED
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
          successThreshold: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
