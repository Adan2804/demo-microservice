# ScaledObject SIMPLE para testing de canary
# Versión minimalista sin triggers complejos
# Útil durante pruebas de rolling update con canary
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: demo-microservice-keda-simple
  namespace: default
  labels:
    app: demo-microservice-keda
    scaling-strategy: simple
    managed-by: argocd-keda
    profile: canary-testing
spec:
  scaleTargetRef:
    name: demo-microservice-keda
  
  minReplicaCount: 3      # Mantener 3 pods siempre
  maxReplicaCount: 3      # No escalar automáticamente
  
  pollingInterval: 30
  cooldownPeriod: 60
  
  # Sin triggers = mantiene minReplicaCount fijo
  # Ideal para pruebas controladas de rolling update
  triggers: []
  
  advanced:
    horizontalPodAutoscalerConfig:
      name: demo-microservice-keda-simple-hpa
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300  # 5 minutos antes de escalar down
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
