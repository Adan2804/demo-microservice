# Deployment para escalado con KEDA
# Copia del deployment de producción pero preparado para HPA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-microservice-keda
  namespace: default
  labels:
    app: demo-microservice-keda
    version: stable
    managed-by: argocd-keda
spec:
  replicas: 3
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 900   # 15 minutos para completar
  minReadySeconds: 10            # Esperar 10s antes de considerar el pod ready
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0          # NUNCA 0 pods disponibles (ZERO DOWNTIME)
      maxSurge: 1                # Solo 1 pod nuevo a la vez
  selector:
    matchLabels:
      app: demo-microservice-keda
      version: stable
  template:
    metadata:
      labels:
        app: demo-microservice-keda
        sidecar.istio.io/inject: "true"
    spec:
      terminationGracePeriodSeconds: 30  # Tiempo para terminar correctamente
      containers:
      - name: demo-microservice-v2
        image: zadan04/demo-microservice:experiment
        imagePullPolicy: IfNotPresent
        lifecycle:
          postStart:
            exec:
              # PAUSA DE 10 MINUTOS solo en el primer pod nuevo
              # Permite probar con header antes de continuar rolling update
              command: ["/bin/sh", "-c", "if [ ! -f /tmp/first-pod-done ]; then echo 'Primer pod - pausando 10 min para testing'; sleep 600; touch /tmp/first-pod-done; fi"]
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]  # Graceful shutdown
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: APP_VERSION
          value: "experiment-v1.0.0-keda"
        - name: ENVIRONMENT
          value: "production-keda"
        - name: EXPERIMENT_ENABLED
          value: "true"
        - name: ISTIO_ENABLED
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
          successThreshold: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
