# ScaledObject para escalado inteligente con KEDA
# Solo usa triggers de cron (sin CPU/Memoria para evitar interferencias)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: demo-microservice-keda-scaler
  namespace: default
  labels:
    app: demo-microservice-keda
    scaling-strategy: intelligent
    managed-by: argocd-keda
  annotations:
    scaledobject.keda.sh/transfer-hpa-ownership: "true"
    description: "Escalado por horario - 2 pods (5:40PM-6PM), 3 pods (resto)"
spec:
  scaleTargetRef:
    name: demo-microservice-keda
  
  minReplicaCount: 2      # NUNCA menos de 2 pods (ZERO DOWNTIME)
  maxReplicaCount: 10
  
  pollingInterval: 10     # Evalúa cada 10 segundos
  cooldownPeriod: 30      # Espera 30 segundos antes de escalar hacia abajo
  
  triggers:
    # Downscale: 5:55 PM - 6:00 PM → 2 pods (mínimo)
    - type: cron
      metadata:
        timezone: "America/Bogota"
        start: "35 14 * * *"
        end: " 2 15 * * *"
        desiredReplicas: "2"
    
    # Upscale: 6:00 PM - 5:55 PM → 3 pods (normal)
    - type: cron
      metadata:
        timezone: "America/Bogota"
        start: " 2 15 * * *"
        end: "35 14 * * *"
        desiredReplicas: "3"
  
  advanced:
    horizontalPodAutoscalerConfig:
      name: demo-microservice-keda-hpa
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0  # Escalar rápido hacia arriba
          policies:
            - type: Pods
              value: 2                    # Agregar 2 pods por período
              periodSeconds: 30
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 30  # Esperar 30s antes de escalar hacia abajo
          policies:
            - type: Pods
              value: 1                     # Remover 1 pod por período (gradual)
              periodSeconds: 30
          selectPolicy: Min
